server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: ai-service

  profiles:
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

ai:
  api:
    base-url: ${AI_API_BASE_URL:https://api.groq.com/openai/v1}
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:openai/gpt-oss-20b}
  internal-api-key: ${AI_INTERNAL_API_KEY:}
  catalog-cache-seconds: ${AI_CATALOG_CACHE_SECONDS:30}
  rate-limit:
    requests-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:60}

product-service:
  base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
  catalog-path: ${PRODUCT_CATALOG_PATH:/api/v1/products}

order-service:
  base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8085}
  orders-path: ${ORDER_SERVICE_ORDERS_PATH:/api/v1/orders}

review-service:
  base-url: ${REVIEW_SERVICE_BASE_URL:http://localhost:8086}
  reviews-path: ${REVIEW_SERVICE_REVIEWS_PATH:/api/v1/reviews}
